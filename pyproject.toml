# ### Build system ###
[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

# ### Project metadata ###
[project]
name = "housemaker"
version = "0.1.0"
description = "Desktop blueprint-to-GLB house prototyping app."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.10",
    "Pillow>=10.4",
    "PyOpenGL>=3.1.7",
    "pyqtgraph>=0.13.7",
    "PySide6>=6.7",
    "shapely>=2.1",
    "trimesh>=4.4",
    "xatlas==0.0.11",
]

# ### Console scripts ###
[project.scripts]
housemaker = "housemaker.main:main"

# ### Setuptools configuration ###
[tool.setuptools]
package-dir = {"" = "src"}

# ### Package discovery ###
[tool.setuptools.packages.find]
where = ["src"]
